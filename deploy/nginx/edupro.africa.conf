# =============================================================================
# Nginx vhost for the production vitrine (edupro-site-prod container, port 3006).
#
# Deploy as  /etc/nginx/sites-available/edupro.africa.conf  on the Droplet.
#
#   sudo cp deploy/nginx/edupro.africa.conf /etc/nginx/sites-available/
#   sudo certbot --nginx -d edupro.africa -d www.edupro.africa
#   sudo ln -sf /etc/nginx/sites-available/edupro.africa.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certbot rewrites the file to add the 443 server block + cert paths on first
# run. Subsequent renewals happen automatically via the certbot.timer systemd
# unit shipped with the certbot package on Debian/Ubuntu.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name edupro.africa www.edupro.africa;

    # ACME challenge for cert renewals (kept HTTP)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Everything else → HTTPS (certbot will inject this redirect)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name edupro.africa www.edupro.africa;

    # SSL — populated by `certbot --nginx`. Paths follow Let's Encrypt defaults.
    ssl_certificate /etc/letsencrypt/live/edupro.africa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edupro.africa/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Gzip — Next.js standalone serves uncompressed; nginx compresses for us.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        image/svg+xml;

    # Form uploads (CV, candidatures…) cap at 10 MB
    client_max_body_size 10M;

    # Aggressive caching for hashed Next.js static assets — they're immutable
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SSR + API routes
    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;

        # WebSocket support (HMR is dev-only, but keeps the door open)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard reverse-proxy headers — Next.js reads X-Forwarded-* for
        # request URL inference (NEXT_PUBLIC_APP_URL is set, so this is a
        # belt-and-braces measure for any code that calls headers().get('host')).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;

        # 60s is enough for any Server Action or API route. Bump if you have
        # long-running endpoints (file processing, external API calls, …).
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
