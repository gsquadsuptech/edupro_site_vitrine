name: Build and Deploy edupro-site

# Multi-env: push on `staging` deploys to staging (port 3000, site.edupro.africa)
#            push on `main` deploys to production (port 3006, edupro.africa).
# NEXT_PUBLIC_* are scoped per GitHub Environment (staging / production).
# Server-side secrets live on the Droplet at /opt/edupro-site/{staging,prod}.env.

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Cheap pre-flight: fail in ~45s on a TS regression instead of burning the
  # full 5-min Docker build only to surface the same error.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # next-env.d.ts is gitignored but tsconfig.json includes it. Without it,
      # `next/image-types/global` ambient declarations for *.png/*.jpg are not
      # picked up, and tsc fails on @/assets/images/* imports. Recreate the
      # file with the same content `next dev`/`next build` would generate.
      - name: Generate next-env.d.ts
        run: |
          cat > next-env.d.ts <<'EOF'
          /// <reference types="next" />
          /// <reference types="next/image-types/global" />

          // NOTE: This file should not be edited
          // see https://nextjs.org/docs/app/api-reference/config/typescript for more information.
          EOF
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
        continue-on-error: true

  build-and-push:
    needs: typecheck
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Garde-fou : empêche un déploiement prod qui pointerait vers la base
      # Supabase de staging (ou inversement). NEXT_PUBLIC_* sont figés dans le
      # bundle au build — une mauvaise URL ici = prod servant les données de test.
      - name: Guard — Supabase project matches environment
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          set -euo pipefail
          PROD_REF="cgvetdddfskhrrjziiig"
          STAGING_REF="qofruhdfxvqfsdursqjv"
          if [ "${{ github.ref_name }}" = "main" ]; then
            case "$SUPABASE_URL" in
              *"$PROD_REF"*) echo "OK — build PROD pointe vers la base prod ($PROD_REF)";;
              *) echo "::error::Build PROD pointe vers une mauvaise base Supabase ($SUPABASE_URL). Attendu le projet prod $PROD_REF. Corriger le secret NEXT_PUBLIC_SUPABASE_URL de l'environnement GitHub 'production'."; exit 1;;
            esac
          else
            case "$SUPABASE_URL" in
              *"$STAGING_REF"*) echo "OK — build STAGING pointe vers la base staging ($STAGING_REF)";;
              *"$PROD_REF"*) echo "::error::Build STAGING pointe vers la base PROD ($PROD_REF). Corriger le secret NEXT_PUBLIC_SUPABASE_URL de l'environnement 'staging'."; exit 1;;
              *) echo "::warning::URL Supabase staging inattendue ($SUPABASE_URL).";;
            esac
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long

      # NEXT_PUBLIC_* are inlined into the client bundle by `next build`. They
      # MUST come from the env-scoped secrets so staging and prod ship distinct
      # bundles pointing at their respective Supabase/SaaS origins.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SAAS_URL=${{ secrets.NEXT_PUBLIC_SAAS_URL }}
            NEXT_PUBLIC_DASHBOARD_ADMIN_URL=${{ secrets.NEXT_PUBLIC_DASHBOARD_ADMIN_URL }}
            NEXT_PUBLIC_DASHBOARD_INSTRUCTOR_URL=${{ secrets.NEXT_PUBLIC_DASHBOARD_INSTRUCTOR_URL }}
            NEXT_PUBLIC_DASHBOARD_STUDENT_URL=${{ secrets.NEXT_PUBLIC_DASHBOARD_STUDENT_URL }}
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      # Branch -> deployment topology mapping. Staging stays on the port the
      # current edupro-site container already binds (3000); prod takes 3006.
      - name: Compute deployment params
        id: params
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env_name=prod" >> "$GITHUB_OUTPUT"
            echo "container_name=edupro-site-prod" >> "$GITHUB_OUTPUT"
            echo "port=3006" >> "$GITHUB_OUTPUT"
          else
            echo "env_name=staging" >> "$GITHUB_OUTPUT"
            echo "container_name=edupro-site-staging" >> "$GITHUB_OUTPUT"
            echo "port=3000" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Secrets
        run: |
          set -euo pipefail
          missing=0
          for v in DO_HOST DO_USER DO_SSH_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Secret $v is missing."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}

      - name: Setup SSH
        shell: bash
        env:
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_SSH_PASSPHRASE: ${{ secrets.DO_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          [ -n "$DO_SSH_KEY" ] || { echo "::error::DO_SSH_KEY manquant"; exit 1; }

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$DO_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          if [ -n "${DO_SSH_PASSPHRASE:-}" ]; then
            echo -e "#!/bin/bash\necho \"$DO_SSH_PASSPHRASE\"" > ~/.ssh/askpass
            chmod +x ~/.ssh/askpass
            export DISPLAY=:0
            export SSH_ASKPASS=~/.ssh/askpass
            setsid ssh-add ~/.ssh/id_rsa < /dev/null
          else
            ssh-add ~/.ssh/id_rsa
          fi

          # ssh-keyscan populates known_hosts so StrictHostKeyChecking=yes is safe.
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      - name: Execute Deployment via SSH
        env:
          ENV_NAME: ${{ steps.params.outputs.env_name }}
          CONTAINER_NAME: ${{ steps.params.outputs.container_name }}
          PORT: ${{ steps.params.outputs.port }}
        run: |
          ssh -i ~/.ssh/id_rsa \
              -o StrictHostKeyChecking=yes \
              -o PasswordAuthentication=no \
              -o BatchMode=yes \
              -o ConnectTimeout=30 \
              ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} \
              ENV_NAME="$ENV_NAME" \
              CONTAINER_NAME="$CONTAINER_NAME" \
              PORT="$PORT" \
              bash -s << 'EOF'
            set -euo pipefail

            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
            ENV_FILE="/opt/edupro-site/${ENV_NAME}.env"
            PREV_TAG="${{ env.REGISTRY }}/${{ github.repository }}:previous-${ENV_NAME}"

            if [ ! -f "$ENV_FILE" ]; then
              echo "::error::$ENV_FILE absent sur la Droplet — créer le fichier avant le premier deploy (template: deploy/site.env.${ENV_NAME}.example)."
              exit 1
            fi

            # NEXT_PUBLIC_* must also be passed at runtime: server-side code
            # (lib/supabase/server.ts, lib/utils.ts, role-guard.ts) reads them
            # from process.env at request time, not from the client bundle.
            run_container() {
              local image="$1"
              sudo docker run -d \
                --name "$CONTAINER_NAME" \
                --restart always \
                --env-file "$ENV_FILE" \
                -e NEXT_PUBLIC_APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}" \
                -e NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
                -e NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
                -e NEXT_PUBLIC_SAAS_URL="${{ secrets.NEXT_PUBLIC_SAAS_URL }}" \
                -e NEXT_PUBLIC_DASHBOARD_ADMIN_URL="${{ secrets.NEXT_PUBLIC_DASHBOARD_ADMIN_URL }}" \
                -e NEXT_PUBLIC_DASHBOARD_INSTRUCTOR_URL="${{ secrets.NEXT_PUBLIC_DASHBOARD_INSTRUCTOR_URL }}" \
                -e NEXT_PUBLIC_DASHBOARD_STUDENT_URL="${{ secrets.NEXT_PUBLIC_DASHBOARD_STUDENT_URL }}" \
                -e NEXT_PUBLIC_RECAPTCHA_SITE_KEY="${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}" \
                -e NEXT_PUBLIC_TURNSTILE_SITE_KEY="${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}" \
                -p "${PORT}:3000" \
                "$image"
            }

            # Login to GHCR (image is private to the org)
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull first so a failed pull doesn't take down the running container
            echo "Pulling new image..."
            sudo docker pull "$IMAGE"

            # Tag the currently-running image as :previous-${env} for rollback
            if sudo docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
              PREV_IMAGE=$(sudo docker inspect --format='{{.Config.Image}}' "$CONTAINER_NAME" || echo "")
              [ -n "$PREV_IMAGE" ] && sudo docker tag "$PREV_IMAGE" "$PREV_TAG" || true
            fi

            # One-shot migration: stop the legacy "edupro-site" container so the
            # new "edupro-site-staging" can bind port 3000. Becomes a no-op once
            # the legacy container is gone.
            if [ "$CONTAINER_NAME" = "edupro-site-staging" ] && sudo docker ps -a --format '{{.Names}}' | grep -q '^edupro-site$'; then
              echo "Cleaning up legacy edupro-site container..."
              sudo docker stop edupro-site || true
              sudo docker rm edupro-site || true
            fi

            sudo docker stop "$CONTAINER_NAME" || true
            sudo docker rm "$CONTAINER_NAME" || true

            echo "Starting new container ${CONTAINER_NAME} on port ${PORT}..."
            run_container "$IMAGE"

            echo "Running healthcheck..."
            success=0
            for i in {1..24}; do
              if curl -fs "http://localhost:${PORT}" > /dev/null; then
                success=1
                break
              fi
              echo "Waiting for container to be ready... ($i/24)"
              sleep 5
            done

            if [ $success -eq 1 ]; then
              echo "Deployment successful — ${CONTAINER_NAME} is UP on port ${PORT}."
              sudo docker image prune -f || true
            else
              echo "Healthcheck failed! Logs:"
              sudo docker logs "$CONTAINER_NAME" | tail -n 60
              echo "Rolling back to previous image..."
              sudo docker stop "$CONTAINER_NAME" || true
              sudo docker rm "$CONTAINER_NAME" || true
              if sudo docker image inspect "$PREV_TAG" > /dev/null 2>&1; then
                run_container "$PREV_TAG"
                echo "Rolled back to $PREV_TAG."
              else
                echo "::warning::No :previous-${ENV_NAME} image found to roll back to (first deploy?)."
              fi
              exit 1
            fi
          EOF
